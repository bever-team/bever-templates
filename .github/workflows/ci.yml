name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bever-templates
      - uses: actions/checkout@v4
        with:
          repository: bever-team/bever
          path: bever
      - uses: actions/checkout@v4
        with:
          repository: bever-team/bever-js
          path: bever-js
      - uses: actions/checkout@v4
        with:
          repository: bever-team/bever-cli
          path: bever-cli
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bever-templates/scripts/verify.sh
